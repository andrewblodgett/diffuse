name: release

# Builds a signed release APK and attaches it to a GitHub Release whenever you
# push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DRIVE_CLIENT_ID       OAuth client id  (…apps.googleusercontent.com)
#   DRIVE_CLIENT_SECRET   OAuth client secret (public client — see docs/releasing.md)
#   KEYSTORE_BASE64       base64 of your release .jks  (base64 -w0 diffuse-release.jks)
#   KEYSTORE_PASSWORD     keystore store password
#   KEY_ALIAS             key alias (e.g. diffuse)
#   KEY_PASSWORD          key password
# See docs/releasing.md for how to generate these.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual runs for testing (produces an unsigned/artifact build)

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/diffuse-release.jks"

      - name: Build signed release APK
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          KEYSTORE_FILE: diffuse-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "diffuse-${{ steps.ver.outputs.name }}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/diffuse-release.jks"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: diffuse-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
